# Versions from the development env (conda env `archetype`).
name: v1-multiome-continua
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.15.2
  - scikit-learn=1.7.2
  - anndata=0.11.4
  - h5py=3.13.0
  - scanpy=1.7.2
  - matplotlib-base=3.10.8
  - seaborn=0.13.2
  - statsmodels=0.14.6
  - networkx=3.4.2
  - plotly=6.6.0
  - pip
  - pip:
      - pydeseq2==0.5.2
      - harmonypy==2.0.0
      - py-pcha==0.1.3
