# Versions from the development env (conda env `archetype`).
name: v1-multiome-continua
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.26.4
  - libopenblas=0.3.32   # BLAS version changes PCA/varimax and DESeq2 at ~1e-4 to 1e-1
  - pandas=2.3.3
  - scipy=1.15.2
  - scikit-learn=1.7.2
  - anndata=0.11.4
  - h5py=3.13.0
  - pyarrow=23.0.1
  - matplotlib-base=3.10.8
  - seaborn=0.13.2
  - statsmodels=0.14.6
  - networkx=3.4.2
  - plotly=6.6.0
  - pip
  - pip:
      - pydeseq2==0.5.2
      - harmonypy==2.0.0
      - py-pcha==0.1.3
